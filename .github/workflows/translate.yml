name: Cloud Translation Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Translation Script
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: python translate.py

      - name: Commit and Push Translated Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add american_roman.oxt translation_checkpoint.json || true
          git commit -m "Heavy Translation via Groq API (Roman Urdu)" || echo "No changes to commit"
          git push || echo "Push skipped or failed"
